
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Article Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #5535c9;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 35px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            background: #6345d9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4930b5;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #generate {
            width: 100%;
            margin-top: 18px;
        }

        #status {
            text-align: center;
            margin-top: 20px;
            color: #5535c9;
        }

        #articleSection {
            display: none;
            margin-top: 30px;
        }

        #output {
            padding: 25px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 10px;
            line-height: 1.8;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .article-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media(max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Article Generator</h1>

    <p class="subtitle">
        Generate informative articles of approximately
        500 words using Artificial Intelligence.
    </p>

    <form id="articleForm">

        <label for="topic">Enter Your Article Topic</label>

        <input
            type="text"
            id="topic"
            placeholder="Example: Future of Artificial Intelligence"
            required
        >

        <button type="submit" id="generate">
            Generate Article
        </button>

    </form>

    <p id="status" role="status"></p>

    <div id="articleSection">

        <div class="article-heading">
            <h2>Generated Article</h2>

            <button type="button" id="copy">
                Copy Article
            </button>
        </div>

        <div id="output"></div>

    </div>

</div>

<script>

// Paste your Make.com Custom Webhook URL here
const WEBHOOK_URL = "https://hook.eu1.make.com/8bemoxqips5o7hbrdmwnvyintk33y3sj";

const form = document.getElementById("articleForm");
const topicInput = document.getElementById("topic");
const generateButton = document.getElementById("generate");
const statusText = document.getElementById("status");
const output = document.getElementById("output");
const articleSection = document.getElementById("articleSection");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const topic = topicInput.value.trim();

    if (!topic) {
        statusText.textContent = "Please enter a topic.";
        return;
    }

    generateButton.disabled = true;
    generateButton.textContent = "Generating...";
    statusText.textContent = "AI is writing your article. Please wait...";

    articleSection.style.display = "none";

    try {

        const response = await fetch(
            WEBHOOK_URL + "?topic=" + encodeURIComponent(topic)
        );

        if (!response.ok) {
            throw new Error("Request failed: " + response.status);
        }

        const article = await response.text();

        if (!article.trim()) {
            throw new Error("No article was returned.");
        }

        output.textContent = article;

        articleSection.style.display = "block";

        statusText.textContent = "Article generated successfully!";

    } catch (error) {

        statusText.textContent =
            "Error: " + error.message;

    } finally {

        generateButton.disabled = false;
        generateButton.textContent = "Generate Article";

    }

});

document.getElementById("copy").addEventListener("click", async function() {

    try {

        await navigator.clipboard.writeText(output.textContent);

        this.textContent = "Copied!";

    } catch (error) {

        statusText.textContent = "Unable to copy the article.";

    }

});

</script>

</body>
</html>
